const curT=()=>document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');

function go(){const k=(location.hash.slice(1))||'dashboard',p=NAV.some(n=>n[0]==k)?k:'dashboard';$('#sb').innerHTML=lgH()+'<h1>'+ic('ship',22)+' DRYPORT CONTROL</h1>'+NAV.map(n=>`<a class="${n[0]==p?'on':''}" onclick="nav('${n[0]}'${n[0]=='dashboard'?",'Overview'":''})">${ic(n[1],18)} ${n[2]}</a>`).join('');try{$('#ct').className=(p=='dashboard'&&TAB.dashboard=='Overview')?'full':'';$('#ct').innerHTML=P[p]();Object.keys(TS).forEach(i=>$('#t_'+i)&&rt(i))}catch(e){$('#ct').innerHTML='<div class="cd">Something went wrong loading this page.</div>'}scrollTo(0,0)}
$('#hd').innerHTML=`<span class="hl"><img class="hd" src="${LG.ad}" alt="WE"><img class="hn" src="${LG.au}" alt=""></span><button class="ib" onclick="document.body.classList.toggle('c')">${ic('menu',20)}</button><div id="gs" style="position:relative"><span class="si">${ic('search',16)}</span><input id="gi" placeholder="Search containers, shipments, orders, customers, invoices..." oninput="gsr(this.value)" onfocus="gsr(this.value)"><div id="gr"></div></div><div style="flex:1"></div><span class="mu" onclick="nav('analytics')" title="Choose reporting period (Analytics)" style="cursor:pointer;display:flex;gap:6px;align-items:center;white-space:nowrap">${ic('cal',16)} 06 Oct 2026</span><div id="bw" style="position:relative"><button class="ib" onclick="tgp()">${ic('bell',20)}<span id="nb"></span></button><div id="np"></div></div><button class="ib" id="tt" onclick="togT()"></button><button class="ib" title="Settings" onclick="nav('alerts','Settings')">${ic('settings',20)}</button>`;badge();tIc();document.addEventListener('click',e=>{if(!e.target.closest('#gs'))$('#gr').style.display='none';if(!e.target.closest('#bw'))$('#np').style.display='none'});addEventListener('hashchange',go);go();
